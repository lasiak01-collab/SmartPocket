<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Logo – podgląd</title>
<style>
  body { padding: 16px; }
  .row { display: flex; flex-wrap: wrap; gap: 24px; align-items: center; }
  .stack { display: flex; flex-direction: column; gap: 20px; }
  .navy { background: var(--navy); padding: 20px; border-radius: var(--radius-lg); display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
  button { font: inherit; min-height: 44px; padding: 0 16px; border-radius: var(--radius-pill); border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); cursor: pointer; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var E = window.Energypedia, h = React.createElement;
  function Demo() {
    var s = React.useState(0), n = s[0], set = s[1];
    return h('div', { className: 'stack' },
      h('div', { className: 'row' },
        h(E.Logo, { key: 'a' + n, href: '#', size: 'lg' }),
        h('button', { type: 'button', onClick: function () { set(n + 1); } }, 'Odtwórz wejście')),
      h('div', { className: 'row' },
        h(E.Logo, { size: 'sm', animate: 'none' }),
        h(E.Logo, { size: 'sm', withDomain: false, animate: 'none' }),
        h(E.Logo, { key: 's' + n, variant: 'signet', size: 40 })),
      h('div', { className: 'navy' },
        h(E.Logo, { key: 'i' + n, tone: 'inverse' }),
        h(E.Logo, { tone: 'inverse', variant: 'signet', size: 40, animate: 'none' })));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
