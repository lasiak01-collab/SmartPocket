<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>AnswerCard – podgląd</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&family=Space+Grotesk:wght@300..700&display=swap">
<style>
  body { padding: 16px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; }
  .col { display: flex; flex-direction: column; gap: 12px; }
  .grid { display: flex; flex-wrap: wrap; gap: 16px; }
  .grid > * { flex: 1 1 220px; }
  .navy { background: var(--navy); padding: 16px; border-radius: var(--radius-lg); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var E = window.Energypedia, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h(E.AnswerCard, {
      question: 'Co to jest opłata mocowa?',
      answer: 'Opłata mocowa to pozycja na rachunku, która finansuje rynek mocy, czyli płatności dla elektrowni i magazynów energii za gotowość do pracy. W 2026 r. gospodarstwo domowe zużywające 1200–2800 kWh rocznie płaci 17,18 zł netto miesięcznie.',
      sources: [{ label: 'Hasło: opłata mocowa' }, { label: 'Informacja Prezesa URE o stawkach na 2026 r.' }]
    })
  );
</script>
</body>
</html>
