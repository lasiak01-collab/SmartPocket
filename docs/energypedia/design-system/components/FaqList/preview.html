<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>FaqList — podgląd</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&family=Space+Grotesk:wght@300..700&display=swap">
<style>
  body { padding: 16px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; }
  .col { display: flex; flex-direction: column; gap: 12px; }
  .grid { display: flex; flex-wrap: wrap; gap: 16px; }
  .grid > * { flex: 1 1 220px; }
  .navy { background: var(--navy); padding: 16px; border-radius: var(--radius-lg); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var E = window.Energypedia, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h(E.FaqList, { items: [
      { question: 'Dlaczego rachunek rośnie, choć prąd na giełdzie tanieje?', answer: 'Sprzedawcy kupują energię z wyprzedzeniem, a dużą część rachunku stanowią dystrybucja i opłaty.' },
      { question: 'Czy zmiana sprzedawcy zmienia operatora sieci?', answer: 'Nie. Operator sieci zostaje ten sam; zmieniasz tylko sprzedawcę energii.' },
      { question: 'Czy taryfa dynamiczna się opłaca?', answer: 'Tylko gdy możesz przesuwać zużycie na tanie godziny.' }] })
  );
</script>
</body>
</html>
